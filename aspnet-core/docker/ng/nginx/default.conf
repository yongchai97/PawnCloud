server {
    listen 80;
    server_name pmscloudapp.com www.pmscloudapp.com api.pmscloudapp.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.pmscloudapp.com;

    ssl_certificate /etc/letsencrypt/live/pmscloudapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pmscloudapp.com/privkey.pem;

    location / {
        proxy_pass http://pmscloud_web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    server_name pmscloudapp.com www.pmscloudapp.com;

    ssl_certificate /etc/letsencrypt/live/pmscloudapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pmscloudapp.com/privkey.pem;

    location / {
        proxy_pass http://pmscloud_ng:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
