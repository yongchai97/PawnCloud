<form autocomplete="off" #pawnTicketForm="ngForm" novalidate (ngSubmit)="save()">
    <abp-modal-header [title]="'CreateNewPawnTicket' | localize" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
    <div class="modal-body">
        <abp-validation-summary [control]="pawnTicketForm"></abp-validation-summary>
        <div class="row g-3">
            <div class="col-md-6 form-group">
                <label for="TicketNo">{{ 'TicketNo' | localize }} *</label>
                <input class="form-control" id="TicketNo" name="ticketNo" [(ngModel)]="pawnTicket.ticketNo" required />
            </div>
            <div class="col-md-6 form-group">
                <label for="Customer">{{ 'Customer' | localize }} *</label>
                <select class="form-control" id="Customer" name="customer" [(ngModel)]="pawnTicket.customer" required>
                    <option [ngValue]="undefined">{{ 'Select' | localize }}</option>
                    <option *ngFor="let customer of customers" [ngValue]="customer.id">{{ customer.displayName }}</option>
                </select>
            </div>
            <div class="col-md-6 form-group">
                <label for="ItemListing">{{ 'ItemListing' | localize }} *</label>
                <select class="form-control" id="ItemListing" name="itemListing" [(ngModel)]="pawnTicket.itemListing" required>
                    <option [ngValue]="undefined">{{ 'Select' | localize }}</option>
                    <option *ngFor="let item of itemListings" [ngValue]="item.id">{{ item.code }} - {{ item.description }}</option>
                </select>
            </div>
            <div class="col-md-6 form-group">
                <label for="ItemStatus">{{ 'ItemStatus' | localize }} *</label>
                <select class="form-control" id="ItemStatus" name="itemStatus" [(ngModel)]="pawnTicket.itemStatus" required>
                    <option [ngValue]="undefined">{{ 'Select' | localize }}</option>
                    <option *ngFor="let status of itemStatuses" [ngValue]="status.id">{{ status.code }} - {{ status.description }}</option>
                </select>
            </div>
            <div class="col-md-6 form-group">
                <label for="GoldType">{{ 'GoldType' | localize }} *</label>
                <select class="form-control" id="GoldType" name="goldType" [(ngModel)]="pawnTicket.goldType" required>
                    <option [ngValue]="undefined">{{ 'Select' | localize }}</option>
                    <option *ngFor="let goldType of goldTypes" [ngValue]="goldType.id">{{ goldType.purity }} - {{ goldType.description }}</option>
                </select>
            </div>
            <div class="col-md-6 form-group">
                <label for="IncludedItems">{{ 'IncludedItems' | localize }}</label>
                <select class="form-control" id="IncludedItems" name="includedItems" [(ngModel)]="pawnTicket.includedItems">
                    <option [ngValue]="undefined">{{ 'Select' | localize }}</option>
                    <option *ngFor="let item of includedItems" [ngValue]="item.id">{{ item.displayName }}</option>
                </select>
            </div>
            <div class="col-md-6 form-group"><label for="Weight">{{ 'Weight' | localize }}</label><input type="number" class="form-control" id="Weight" name="weight" [(ngModel)]="pawnTicket.weight" /></div>
            <div class="col-md-6 form-group"><label for="Length">{{ 'Length' | localize }}</label><input type="number" class="form-control" id="Length" name="length" [(ngModel)]="pawnTicket.length" /></div>
            <div class="col-md-6 form-group"><label for="Brand">{{ 'Brand' | localize }}</label><input class="form-control" id="Brand" name="brand" [(ngModel)]="pawnTicket.brand" /></div>
            <div class="col-md-6 form-group"><label for="Value">{{ 'Value' | localize }}</label><input type="number" class="form-control" id="Value" name="value" [(ngModel)]="pawnTicket.value" /></div>
            <div class="col-md-6 form-group"><label for="IncludedItemWeight">{{ 'IncludedItemWeight' | localize }}</label><input type="number" class="form-control" id="IncludedItemWeight" name="includedItemWeight" [(ngModel)]="pawnTicket.includedItemWeight" /></div>
            <div class="col-12 form-group"><label for="Description">{{ 'Description' | localize }}</label><textarea class="form-control" id="Description" name="description" rows="3" [(ngModel)]="pawnTicket.description"></textarea></div>
        </div>
    </div>
    <abp-modal-footer [saveDisabled]="saving || pawnTicketForm.invalid" [cancelDisabled]="saving" (onCancelClick)="bsModalRef.hide()" (onSaveClick)="save()"></abp-modal-footer>
</form>
