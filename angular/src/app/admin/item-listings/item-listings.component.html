<div [@routerTransition]>
    <div class="content-header"><div class="container-fluid"><h1 class="m-0">Item Listing</h1></div></div>
    <section class="content px-2 pb-5"><div class="container-fluid"><div class="card">
        <div class="card-header d-flex justify-content-between align-items-center"><h3 class="card-title">Item Listings</h3><button type="button" class="btn btn-primary btn-sm" (click)="newListing()"><i class="fas fa-plus"></i> Add Item Listing</button></div>
        <div class="card-body table-responsive p-0">
            <p-table [value]="records" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 25, 50]" [loading]="loading" styleClass="p-datatable-sm">
                <ng-template pTemplate="header"><tr><th>Code</th><th>Description</th><th>Category</th><th style="width: 150px">Actions</th></tr></ng-template>
                <ng-template pTemplate="body" let-record><tr><td>{{ record.code }}</td><td>{{ record.description }}</td><td>{{ record.category }}</td><td><button type="button" class="btn btn-sm btn-outline-primary mr-1" (click)="editListing(record)"><i class="fas fa-edit"></i></button><button type="button" class="btn btn-sm btn-outline-danger" (click)="deactivate(record)"><i class="fas fa-ban"></i></button></td></tr></ng-template>
                <ng-template pTemplate="emptymessage"><tr><td colspan="4" class="text-center">No item listings found.</td></tr></ng-template>
            </p-table>
        </div>
        <form *ngIf="editing" #listingForm="ngForm" (ngSubmit)="save()" class="card-footer border-top">
            <h5>{{ form.id ? 'Edit Item Listing' : 'Add Item Listing' }}</h5>
            <div class="form-row">
                <div class="form-group col-md-3"><label for="listingCode">Code</label><input id="listingCode" name="code" class="form-control" [(ngModel)]="form.code" required /></div>
                <div class="form-group col-md-4"><label for="listingDescription">Description</label><input id="listingDescription" name="description" class="form-control" [(ngModel)]="form.description" required /></div>
                <div class="form-group col-md-3"><label for="listingCategory">Category</label><input id="listingCategory" name="category" class="form-control" [(ngModel)]="form.category" required /></div>
                <div class="form-group col-md-2 d-flex align-items-end"><div class="btn-group w-100"><button type="submit" class="btn btn-primary" [disabled]="saving">Save</button><button type="button" class="btn btn-secondary" [disabled]="saving" (click)="cancel()">Cancel</button></div></div>
            </div>
        </form>
    </div></div></section>
</div>
