<form autocomplete="off" #goldTypeForm="ngForm" novalidate (ngSubmit)="save()">
    <abp-modal-header [title]="'Create Gold Type'" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
    <div class="modal-body">
        <div class="row g-3">
            <div class="col-md-6 form-group"><label for="createPurity">Purity</label><input pInputText class="w-100" id="createPurity" name="purity" [(ngModel)]="form.purity" required /></div>
            <div class="col-md-6 form-group"><label for="createDescription">Description</label><input pInputText class="w-100" id="createDescription" name="description" [(ngModel)]="form.description" required /></div>
            <div class="col-md-6 form-group"><label for="createDefaultPercentage">Default percentage</label><p-inputNumber inputId="createDefaultPercentage" name="defaultPercentage" [(ngModel)]="form.defaultPercentage" [min]="0" [minFractionDigits]="2" [maxFractionDigits]="2" styleClass="w-100"></p-inputNumber></div>
        </div>
    </div>
    <abp-modal-footer [saveDisabled]="saving || goldTypeForm.invalid" [cancelDisabled]="saving" (onCancelClick)="bsModalRef.hide()" (onSaveClick)="save()"></abp-modal-footer>
</form>
