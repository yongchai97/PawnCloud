<form autocomplete="off" #goldTypeForm="ngForm" novalidate (ngSubmit)="save()">
    <abp-modal-header [title]="'Edit Gold Type'" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
    <div class="modal-body">
        <div *ngIf="loading" class="text-center p-3"><i class="fas fa-spinner fa-spin"></i></div>
        <div *ngIf="!loading" class="row g-3">
            <div class="col-md-6 form-group"><label for="editPurity">Purity</label><input pInputText class="w-100" id="editPurity" name="purity" [(ngModel)]="form.purity" required /></div>
            <div class="col-md-6 form-group"><label for="editDescription">Description</label><input pInputText class="w-100" id="editDescription" name="description" [(ngModel)]="form.description" required /></div>
            <div class="col-md-6 form-group"><label for="editDefaultPercentage">Default percentage</label><p-inputNumber inputId="editDefaultPercentage" name="defaultPercentage" [(ngModel)]="form.defaultPercentage" [min]="0" [minFractionDigits]="2" [maxFractionDigits]="2" styleClass="w-100"></p-inputNumber></div>
        </div>
    </div>
    <abp-modal-footer [saveDisabled]="saving || loading || goldTypeForm.invalid" [cancelDisabled]="saving" (onCancelClick)="bsModalRef.hide()" (onSaveClick)="save()"></abp-modal-footer>
</form>
