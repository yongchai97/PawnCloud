<div [@routerTransition]>
    <div class="content-header"><div class="container-fluid"><h1 class="m-0">Item Status</h1></div></div>
    <section class="content px-2 pb-5"><div class="container-fluid"><div class="card">
        <div class="card-header"><h3 class="card-title">Item Statuses</h3></div>
        <div class="card-body table-responsive p-0">
            <p-table [value]="records" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 25, 50]" [loading]="loading" styleClass="p-datatable-sm">
                <ng-template pTemplate="header"><tr><th>Code</th><th>Description</th></tr></ng-template>
                <ng-template pTemplate="body" let-record><tr><td>{{ record.code }}</td><td>{{ record.description }}</td></tr></ng-template>
                <ng-template pTemplate="emptymessage"><tr><td colspan="2" class="text-center">No item statuses found.</td></tr></ng-template>
            </p-table>
        </div>
    </div></div></section>
</div>
