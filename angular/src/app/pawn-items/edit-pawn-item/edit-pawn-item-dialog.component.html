<form autocomplete="off" #pawnItemForm="ngForm" novalidate (ngSubmit)="save()">
    <abp-modal-header [title]="'EditPawnItem' | localize" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
    <div class="modal-body">
        <abp-validation-summary [control]="pawnItemForm"></abp-validation-summary>

        <div class="row g-3 align-items-start">
            <div class="col-md-6 form-group">
                <label for="PawnTicketId" class="fw-bold">{{ 'TicketId' | localize }} *</label>
                <input type="number" class="form-control" id="PawnTicketId" name="pawnTicketId" [(ngModel)]="pawnItem.pawnTicketId" required />
            </div>
            <div class="col-md-6 form-group">
                <label for="Category" class="fw-bold">{{ 'Category' | localize }} *</label>
                <input class="form-control" id="Category" name="category" [(ngModel)]="pawnItem.category" required />
            </div>
            <div class="col-md-6 form-group">
                <label for="SerialNumber">{{ 'SerialNumber' | localize }}</label>
                <input class="form-control" id="SerialNumber" name="serialNumber" [(ngModel)]="pawnItem.serialNumber" />
            </div>
            <div class="col-md-6 form-group">
                <label for="Condition">{{ 'Condition' | localize }}</label>
                <input class="form-control" id="Condition" name="condition" [(ngModel)]="pawnItem.condition" />
            </div>
            <div class="col-12 form-group">
                <label for="Description" class="fw-bold">{{ 'Description' | localize }} *</label>
                <textarea class="form-control" id="Description" name="description" rows="2" [(ngModel)]="pawnItem.description" required></textarea>
            </div>
            <div class="col-md-4 form-group">
                <label>{{ 'Weight' | localize }}</label>
                <input type="number" step="0.01" class="form-control" name="weight" [(ngModel)]="pawnItem.weight" />
            </div>
            <div class="col-md-4 form-group">
                <label>{{ 'Purity' | localize }}</label>
                <input type="number" step="0.01" class="form-control" name="purity" [(ngModel)]="pawnItem.purity" />
            </div>
            <div class="col-md-4 form-group">
                <label>{{ 'EstimatedValue' | localize }}</label>
                <input type="number" step="0.01" class="form-control" name="estimatedValue" [(ngModel)]="pawnItem.estimatedValue" />
            </div>
            <div class="col-md-4 form-group">
                <label>{{ 'MarketValue' | localize }}</label>
                <input type="number" step="0.01" class="form-control" name="marketValue" [(ngModel)]="pawnItem.marketValue" />
            </div>
            <div class="col-md-4 form-group">
                <label>{{ 'LoanValue' | localize }}</label>
                <input type="number" step="0.01" class="form-control" name="loanValue" [(ngModel)]="pawnItem.loanValue" />
            </div>
        </div>
    </div>
    <abp-modal-footer [saveDisabled]="saving || pawnItemForm.invalid" [cancelDisabled]="saving" (onCancelClick)="bsModalRef.hide()" (onSaveClick)="save()"></abp-modal-footer>
</form>
